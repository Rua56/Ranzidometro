<title>Ranzidometro</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Nunito:wght@400;600;700;800&display=swap">
<style>
/* Layout: one narrow phone column, a mascot whose face mirrors the day, three tabs (Oggi / Mese / Tu). Mood sets the hue, theme sets the lightness. */
:root {
  --h: 190; --s: 30;
  --font-display: "Bagel Fat One", "Arial Rounded MT Bold", "Trebuchet MS", system-ui, sans-serif;
  --font-body: "Nunito", "Segoe UI", system-ui, -apple-system, sans-serif;
  --bg: hsl(var(--h) calc(var(--s) * .9%) 94%);
  --surface: hsl(var(--h) calc(var(--s) * .5%) 99%);
  --ink: hsl(var(--h) 30% 13%);
  --muted: hsl(var(--h) 12% 36%);
  --accent: hsl(var(--h) calc(var(--s) * 1%) 36%);
  --on-accent: hsl(var(--h) 40% 98%);
  --accent-soft: hsl(var(--h) calc(var(--s) * 1%) 86%);
  --mascot: hsl(var(--h) calc(var(--s) * 1%) 72%);
  --mascot-ink: hsl(var(--h) 35% 16%);
  --line: hsl(var(--h) 18% 84%);
  --cell-l: 76%; --face-l: 64%; --cellbg-l: 91%; --skin-l: 74%; --snow: hsl(210 45% 80%);
  --cell-ink: hsl(var(--h) 30% 13%);
  --pepper: hsl(4 70% 46%);
  --radius: 22px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: hsl(var(--h) calc(var(--s) * .35%) 10%);
    --surface: hsl(var(--h) calc(var(--s) * .3%) 15%);
    --ink: hsl(var(--h) 30% 93%);
    --muted: hsl(var(--h) 14% 70%);
    --accent: hsl(var(--h) calc(var(--s) * 1%) 66%);
    --on-accent: hsl(var(--h) 40% 10%);
    --accent-soft: hsl(var(--h) calc(var(--s) * .55%) 24%);
    --mascot: hsl(var(--h) calc(var(--s) * .8%) 58%);
    --mascot-ink: hsl(var(--h) 35% 10%);
    --line: hsl(var(--h) 14% 26%);
    --cell-l: 38%; --face-l: 58%; --cellbg-l: 21%; --skin-l: 62%; --snow: hsl(0 0% 100%);
    --cell-ink: hsl(var(--h) 30% 95%);
    --pepper: hsl(4 80% 66%);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: hsl(var(--h) calc(var(--s) * .35%) 10%);
  --surface: hsl(var(--h) calc(var(--s) * .3%) 15%);
  --ink: hsl(var(--h) 30% 93%);
  --muted: hsl(var(--h) 14% 70%);
  --accent: hsl(var(--h) calc(var(--s) * 1%) 66%);
  --on-accent: hsl(var(--h) 40% 10%);
  --accent-soft: hsl(var(--h) calc(var(--s) * .55%) 24%);
  --mascot: hsl(var(--h) calc(var(--s) * .8%) 58%);
  --mascot-ink: hsl(var(--h) 35% 10%);
  --line: hsl(var(--h) 14% 26%);
  --cell-l: 38%; --face-l: 58%; --cellbg-l: 21%; --skin-l: 62%; --snow: hsl(0 0% 100%);
  --cell-ink: hsl(var(--h) 30% 95%);
  --pepper: hsl(4 80% 66%);
  color-scheme: dark;
}
:root[data-mood="temporale"] { --h: 268; --s: 28; }
:root[data-mood="nuvoletta"] { --h: 214; --s: 48; }
:root[data-mood="cosi"]      { --h: 186; --s: 30; }
:root[data-mood="serena"]    { --h: 148; --s: 42; }
:root[data-mood="raggiante"] { --h: 40;  --s: 92; }

* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 16px; line-height: 1.5;
  transition: background-color .6s ease;
}
.app {
  max-width: 560px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 18px 110px;
  display: flex; flex-direction: column; gap: 18px;
}
header.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.logo { font-family: var(--font-display); font-size: 1.7rem; letter-spacing: .01em; line-height: 1; color: var(--accent); }
.brand { min-width: 0; }
.today { font-size: .84rem; font-weight: 700; color: var(--muted); margin-top: 4px; }
.streakpill { display: flex; align-items: center; gap: 6px; font-weight: 800; font-size: .9rem; background: var(--surface); border: 1px solid var(--line); padding: 6px 13px 6px 9px; border-radius: 999px; white-space: nowrap; box-shadow: 0 6px 16px -10px hsl(var(--h) 45% 25% / .4); }
.streakpill .icon { width: 19px; height: 19px; color: var(--pepper); }
.icon.flame { fill: var(--pepper); stroke: var(--pepper); color: var(--pepper); }
.streak .icon { width: 18px; height: 18px; }
.icon { width: 22px; height: 22px; display: block; flex: none; }
.ht { display: flex; align-items: center; gap: 8px; }
.ht .icon { width: 20px; height: 20px; color: var(--accent); }

h1, h2, h3 { margin: 0; text-wrap: balance; }
h2 { font-family: var(--font-display); font-weight: 400; font-size: 1.45rem; line-height: 1.15; }
h3 { font-size: 1rem; font-weight: 800; }
p { margin: 0; }
.muted { color: var(--muted); }
.eyebrow { font-size: .74rem; font-weight: 800; text-transform: uppercase; letter-spacing: .09em; color: var(--muted); }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }

/* mascot */
.stage { display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; }
.mascot { width: 168px; height: 168px; max-width: 100%; }
.mascot.small { width: 110px; height: 110px; }
.bob { animation: bob 3.2s ease-in-out infinite; transform-origin: 50% 90%; }
@keyframes bob { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-5px) } }
.level-name { font-family: var(--font-display); font-size: 2rem; line-height: 1.05; color: var(--accent); }

/* questions */
.progress { display: flex; gap: 6px; }
.progress span { flex: 1; height: 7px; border-radius: 99px; background: var(--line); transition: background .3s; }
.progress span.on { background: var(--accent); }
.qtitle { font-family: var(--font-display); font-weight: 400; font-size: 1.5rem; line-height: 1.15; }
.options { display: grid; gap: 10px; }
.opt {
  font: inherit; font-weight: 700; text-align: left; color: var(--ink);
  background: var(--bg); border: 2px solid var(--line); border-radius: 16px;
  padding: 14px 16px; cursor: pointer; display: flex; gap: 12px; align-items: center;
  transition: transform .12s, border-color .2s, background .2s;
}
.opt:hover { border-color: var(--accent); }
.opt:active { transform: scale(.98); }
.opt.sel { border-color: var(--accent); background: var(--accent-soft); }
.opt .ic { font-size: 1.4rem; width: 1.8rem; text-align: center; flex: none; }
.opt:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, .cell:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.slider-wrap { display: flex; flex-direction: column; gap: 8px; }
input[type=range] { width: 100%; accent-color: var(--accent); height: 32px; }
.slider-val { font-family: var(--font-display); font-size: 3rem; line-height: 1; text-align: center; color: var(--accent); font-variant-numeric: tabular-nums; }
.scale-ends { display: flex; justify-content: space-between; font-size: .82rem; font-weight: 700; color: var(--muted); }
textarea, input[type=text], select {
  font: inherit; color: var(--ink); background: var(--bg); border: 2px solid var(--line);
  border-radius: 14px; padding: 12px 14px; width: 100%;
}
textarea { min-height: 84px; resize: vertical; }

.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.row.between { justify-content: space-between; }
.btn {
  font: inherit; font-weight: 800; border: 0; border-radius: 999px; padding: 13px 22px;
  background: var(--accent); color: var(--on-accent); cursor: pointer; transition: transform .12s, opacity .2s;
}
.btn:active { transform: scale(.97); }
.btn:disabled { opacity: .4; cursor: default; }
.btn.ghost { background: transparent; color: var(--ink); border: 2px solid var(--line); }
.btn.danger { background: var(--pepper); color: var(--surface); }
.btn.wide { flex: 1; }

/* meters */
.meters { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.meter { background: var(--bg); border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.meter .num { font-family: var(--font-display); font-size: 2.1rem; line-height: 1; font-variant-numeric: tabular-nums; }
.meter .num small { font-family: var(--font-body); font-size: .9rem; font-weight: 800; color: var(--muted); }
.meter .lab { font-size: .85rem; font-weight: 700; color: var(--muted); }
.updown { height: 12px; border-radius: 99px; overflow: hidden; display: flex; background: var(--line); }
.updown .up { background: var(--accent); }
.updown .down { background: var(--muted); opacity: .45; }
.peppers { display: flex; gap: 3px; }
.peppers i { width: 14px; height: 14px; border-radius: 50% 50% 50% 0; transform: rotate(-45deg); background: var(--line); }
.peppers i.on { background: var(--pepper); }

.tips { display: flex; flex-direction: column; gap: 10px; padding: 0; margin: 0; list-style: none; }
.tips li { display: flex; gap: 12px; align-items: flex-start; background: var(--bg); border-radius: 14px; padding: 12px 14px; }
.tips li b { display: block; }
.tips .ic { font-size: 1.3rem; flex: none; width: 1.7rem; text-align: center; }
.mission { border: 2px dashed var(--accent); border-radius: 16px; padding: 14px 16px; display: flex; flex-direction: column; gap: 4px; }
.mission .eyebrow { color: var(--accent); }

/* month */
.monthnav { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.iconbtn { font: inherit; font-size: 1.2rem; font-weight: 800; width: 44px; height: 44px; border-radius: 50%; border: 2px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; }
.iconbtn:disabled { opacity: .35; cursor: default; }
.verdict { text-align: center; align-items: center; }
.verdict .title { font-family: var(--font-display); font-size: 1.9rem; line-height: 1.1; color: var(--accent); }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.stat { background: var(--bg); border-radius: 14px; padding: 12px 8px; text-align: center; min-width: 0; }
.stat .v { font-family: var(--font-display); font-size: 1.6rem; line-height: 1.1; font-variant-numeric: tabular-nums; }
.stat .k { font-size: .76rem; font-weight: 700; color: var(--muted); }
.cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
.cal .wd { font-size: .7rem; font-weight: 800; text-align: center; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.cell {
  aspect-ratio: 1; max-width: 100%; border-radius: 11px; border: 0; padding: 3px; font: inherit;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px;
  background: var(--bg); color: var(--muted); font-size: .8rem; font-weight: 800; cursor: default; position: relative;
  font-variant-numeric: tabular-nums;
}
.cell.has { cursor: pointer; background: hsl(var(--ch) calc(var(--cs) * 1%) var(--cell-l)); color: var(--cell-ink); }
.cell.today { box-shadow: inset 0 0 0 2px var(--accent); }
.cell .rz { font-size: .62rem; font-weight: 800; opacity: .85; }
.cell.empty { background: transparent; }
.cell.sel { outline: 3px solid var(--ink); outline-offset: 1px; }
.legend { display: flex; flex-wrap: wrap; gap: 8px 14px; font-size: .78rem; font-weight: 700; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 12px; height: 12px; border-radius: 4px; background: hsl(var(--ch) calc(var(--cs) * 1%) var(--cell-l)); }
.chartbox { overflow-x: auto; }
.chartbox svg { display: block; width: 100%; min-width: 320px; height: auto; }
.chartbox text { fill: var(--muted); font-family: var(--font-body); font-size: 10px; font-weight: 700; }
.daydetail { background: var(--bg); border-radius: 16px; padding: 14px; display: flex; gap: 12px; align-items: center; }
.daydetail .txt { min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.banner { background: var(--accent-soft); color: var(--ink); border-radius: 14px; padding: 10px 14px; font-weight: 700; font-size: .9rem; }

/* tabs */
nav.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; pointer-events: none;
  padding-top: 0;
  padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
nav.tabs .in { pointer-events: auto; max-width: 420px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 6px; box-shadow: 0 14px 34px -12px hsl(var(--h) 45% 18% / .45); }
nav.tabs button {
  font: inherit; font-weight: 800; font-size: .88rem; border: 0; border-radius: 999px; padding: 10px 6px;
  background: transparent; color: var(--muted); cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px;
  transition: background .3s, color .3s;
}
nav.tabs button .ic .icon { width: 20px; height: 20px; }
nav.tabs button[aria-selected="true"] { background: var(--accent); color: var(--on-accent); }
body.welcome nav.tabs { display: none; }
.field { display: flex; flex-direction: column; gap: 6px; font-weight: 700; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(96px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 10px 18px; border-radius: 999px; font-weight: 800; z-index: 60; }
/* ---------- animazioni ---------- */
.app { position: relative; z-index: 1; }
.card { box-shadow: 0 10px 30px -14px hsl(var(--h) 45% 25% / .28); }
#sky { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
#sky .glow { position: absolute; width: 560px; height: 560px; border-radius: 50%; top: -240px; right: -200px; background: radial-gradient(circle, hsl(var(--h) calc(var(--s) * 1%) 62% / .42), transparent 65%); animation: pulse 6s ease-in-out infinite; }
#sky .spark { position: absolute; width: 12px; height: 12px; background: var(--accent); clip-path: polygon(50% 0, 61% 39%, 100% 50%, 61% 61%, 50% 100%, 39% 61%, 0 50%, 39% 39%); opacity: .45; animation: twinkle 2.8s ease-in-out infinite; }
#sky .bub { position: absolute; bottom: -50px; border-radius: 50%; border: 2px solid var(--accent); opacity: .22; animation: rise linear infinite; }
#sky .blob { position: absolute; border-radius: 50%; background: var(--accent-soft); opacity: .7; animation: drift ease-in-out infinite alternate; }
#sky .cloud { position: absolute; left: -180px; width: 140px; height: 44px; background: var(--surface); opacity: .75; border-radius: 40px; animation: sail linear infinite; }
#sky .cloud::before, #sky .cloud::after { content: ""; position: absolute; background: inherit; border-radius: 50%; }
#sky .cloud::before { width: 62px; height: 62px; top: -30px; left: 22px; }
#sky .cloud::after { width: 46px; height: 46px; top: -20px; left: 72px; }
#sky.storm .cloud { background: var(--muted); opacity: .3; }
#sky .drop { position: absolute; top: -20px; width: 2px; height: 16px; border-radius: 2px; background: var(--accent); opacity: .4; animation: fall linear infinite; }
@keyframes pulse { 50% { transform: scale(1.08); opacity: .8; } }
@keyframes twinkle { 0%, 100% { transform: scale(.4) rotate(0); opacity: .15; } 50% { transform: scale(1.2) rotate(45deg); opacity: .6; } }
@keyframes rise { to { transform: translateY(-120vh) translateX(30px); } }
@keyframes drift { to { transform: translate(40px, 34px) scale(1.15); } }
@keyframes sail { to { transform: translateX(calc(100vw + 360px)); } }
@keyframes fall { to { transform: translateY(115vh); } }

.mascot-btn { background: none; border: 0; padding: 0; cursor: pointer; border-radius: 50%; -webkit-tap-highlight-color: transparent; }
.mascot .eyes { transform-box: fill-box; transform-origin: center; animation: blink 4.6s infinite; }
.mascot .rays { transform-origin: 100px 108px; animation: spin 20s linear infinite; }
.mascot .rain line { animation: rain .9s linear infinite; }
.mascot .rain line:nth-child(2) { animation-delay: .3s; } .mascot .rain line:nth-child(3) { animation-delay: .6s; }
.mascot .steam path { animation: steam 1.4s ease-in-out infinite; } .mascot .steam path + path { animation-delay: .7s; }
.mascot-btn.boing .mascot { animation: boing .65s cubic-bezier(.34, 1.56, .64, 1); }
@keyframes blink { 0%, 91%, 100% { transform: scaleY(1); } 94% { transform: scaleY(.1); } }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes rain { 0% { transform: translateY(-4px); opacity: 0; } 30% { opacity: 1; } 100% { transform: translateY(16px); opacity: 0; } }
@keyframes steam { 0% { opacity: 0; transform: translateY(10px); } 50% { opacity: 1; } 100% { opacity: 0; transform: translateY(-12px); } }
@keyframes boing { 0% { transform: scale(1); } 25% { transform: scale(1.18, .82); } 50% { transform: scale(.9, 1.12) translateY(-16px); } 75% { transform: scale(1.05, .95); } 100% { transform: scale(1); } }
.say { position: relative; background: var(--surface); border: 2px solid var(--line); border-radius: 18px; padding: 8px 16px; font-weight: 800; animation: pop .4s cubic-bezier(.34, 1.56, .64, 1); max-width: 260px; }
.say::after { content: ""; position: absolute; top: -9px; left: 50%; width: 14px; height: 14px; background: var(--surface); border-left: 2px solid var(--line); border-top: 2px solid var(--line); transform: translateX(-50%) rotate(45deg); }
@keyframes pop { from { transform: scale(.5); opacity: 0; } }

#view.enter > * { animation: rise-in .55s cubic-bezier(.22, 1.2, .36, 1) both; animation-delay: calc(var(--i, 0) * 80ms); }
#view.enter > .noanim { animation: none; }
@keyframes rise-in { from { opacity: 0; transform: translateY(18px) scale(.98); } }
.qcard.fwd .qbody { animation: slide-r .45s cubic-bezier(.22, 1.2, .36, 1) both; }
.qcard.bwd .qbody { animation: slide-l .45s cubic-bezier(.22, 1.2, .36, 1) both; }
@keyframes slide-r { from { opacity: 0; transform: translateX(40px); } }
@keyframes slide-l { from { opacity: 0; transform: translateX(-40px); } }
.qbody { display: flex; flex-direction: column; gap: 14px; }
.opt { animation: pop-in .4s cubic-bezier(.34, 1.56, .64, 1) both; animation-delay: calc(var(--k, 0) * 60ms + 120ms); }
.opt.sel { animation: pick .35s ease; }
.opt:hover .ic { animation: wiggle .5s ease; }
@keyframes pop-in { from { opacity: 0; transform: scale(.6); } }
@keyframes pick { 50% { transform: scale(1.05); } }
@keyframes wiggle { 25% { transform: rotate(-14deg); } 75% { transform: rotate(14deg); } }
.btn { transition: transform .25s cubic-bezier(.34, 1.56, .64, 1), opacity .2s; }
.btn:hover:not(:disabled) { transform: translateY(-2px); }
.btn:active:not(:disabled) { transform: scale(.93); }
.enter .level-name { animation: wobble-in .8s .2s both; }
@keyframes wobble-in { 0% { opacity: 0; transform: scale(.4) rotate(-8deg); } 60% { opacity: 1; transform: scale(1.12) rotate(3deg); } 100% { transform: none; } }
.enter .updown .up { animation: grow 1.1s .35s cubic-bezier(.22, 1, .36, 1) both; transform-origin: left; }
@keyframes grow { from { transform: scaleX(0); } }
.enter .peppers i.on { animation: pepper-pop .4s cubic-bezier(.34, 1.56, .64, 1) both; animation-delay: calc(.5s + var(--k, 0) * .13s); }
@keyframes pepper-pop { from { transform: rotate(-45deg) scale(0); } }
.enter .tips li { animation: rise-in .5s both; animation-delay: calc(.5s + var(--k, 0) * 110ms); }
.enter .cell.has { animation: pop-in .4s cubic-bezier(.34, 1.56, .64, 1) both; animation-delay: calc(var(--k, 0) * 22ms + .2s); }
.cell.has { transition: transform .2s cubic-bezier(.34, 1.56, .64, 1); }
.cell.has:hover { transform: scale(1.1); }
.enter .chartbox rect { transform-box: fill-box; animation: bar .6s cubic-bezier(.22, 1.2, .36, 1) both; animation-delay: calc(var(--k, 0) * 25ms + .3s); }
.chartbox rect.u { transform-origin: center bottom; } .chartbox rect.d { transform-origin: center top; }
@keyframes bar { from { transform: scaleY(0); } }
nav.tabs button[aria-selected="true"] .ic { animation: hop .5s cubic-bezier(.34, 1.56, .64, 1); }
@keyframes hop { 40% { transform: translateY(-7px) scale(1.15); } }
#fx { position: fixed; inset: 0; pointer-events: none; z-index: 20; overflow: hidden; }
#fx .p { position: absolute; font-size: 1.4rem; animation: fly .9s cubic-bezier(.2, .8, .3, 1) forwards; }
@keyframes fly { to { transform: translate(var(--dx), var(--dy)) rotate(var(--r)) scale(.4); opacity: 0; } }
#fx .cf { position: absolute; top: -16px; width: 9px; height: 14px; border-radius: 2px; animation: cf linear forwards; }
@keyframes cf { to { transform: translate(var(--dx), 108vh) rotate(var(--r)); } }
#fx .float { position: absolute; font-size: 1.5rem; animation: floatup 2.4s ease-out forwards; }
@keyframes floatup { to { transform: translate(var(--dx), -220px) scale(1.3); opacity: 0; } }
.calc { padding-block: 24px; }
.dial { width: 260px; max-width: 100%; height: auto; }
.dial text { fill: var(--muted); font-family: var(--font-body); font-size: 11px; font-weight: 800; }
.needle { transform-origin: 110px 115px; animation: needle 1.9s cubic-bezier(.3, 1.3, .5, 1) forwards; }
@keyframes needle { 0% { transform: rotate(-90deg); } 30% { transform: rotate(75deg); } 50% { transform: rotate(-45deg); } 72% { transform: rotate(calc(var(--deg) * 1deg + 14deg)); } 100% { transform: rotate(calc(var(--deg) * 1deg)); } }

/* cielo: ora e stagione */

#sky .moon { position: absolute; top: 70px; right: 22px; width: 46px; height: 46px; border-radius: 50%; box-shadow: -11px 6px 0 0 hsl(48 90% 70%); transform: rotate(-20deg); opacity: .85; }
#sky .leaf { position: absolute; top: -30px; width: 16px; height: 16px; border-radius: 0 75% 0 75%; animation: leaf linear infinite; opacity: .8; }
#sky .flake { position: absolute; top: -12px; border-radius: 50%; background: var(--snow); animation: leaf linear infinite; opacity: .9; }

@keyframes leaf { 0% { transform: translate(0, 0) rotate(0); } 25% { transform: translate(var(--dx), 28vh) rotate(140deg); } 50% { transform: translate(0, 56vh) rotate(270deg); } 75% { transform: translate(var(--dx), 84vh) rotate(400deg); } 100% { transform: translate(0, 112vh) rotate(540deg); } }
/* Ranzi reattivo */
.mascot-btn { position: relative; }

.mascot-btn.sleeping::after { content: "z z z"; position: absolute; top: 4%; right: -2%; font-family: var(--font-display); font-size: 1.1rem; color: var(--muted); animation: zz 2.4s ease-in-out infinite; pointer-events: none; }
@keyframes zz { 0% { opacity: 0; transform: translate(0, 8px) scale(.8); } 40% { opacity: 1; } 100% { opacity: 0; transform: translate(10px, -16px) scale(1.15); } }
.mascot .zzz { animation: zz 2.4s ease-in-out infinite; }
.mascot .halo { animation: halo 2.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes halo { 50% { transform: translateY(-4px); } }
/* personalizza */
.ranzi-preview { display: flex; justify-content: center; }
.swatches { display: flex; flex-wrap: wrap; gap: 10px; }
.swatch { width: 40px; height: 40px; border-radius: 50%; border: 3px solid var(--surface); box-shadow: 0 0 0 2px var(--line); cursor: pointer; background: var(--mascot); }

.hats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.hat { font: inherit; font-size: .78rem; font-weight: 800; color: var(--ink); background: var(--bg); border: 2px solid transparent; border-radius: 16px; padding: 6px 4px 8px; display: flex; flex-direction: column; align-items: center; gap: 2px; cursor: pointer; min-width: 0; }
.hat .mascot { width: 64px; height: 64px; }

/* grafico linea */
.chartbox .mline { fill: none; stroke: var(--accent); stroke-width: 3; stroke-linecap: round; }

@keyframes draw { to { stroke-dashoffset: 0; } }
@keyframes fadein { from { opacity: 0; } }
.chartkey { display: flex; gap: 16px; font-size: .78rem; font-weight: 700; color: var(--muted); }
.chartkey i { display: inline-block; width: 18px; height: 0; border-top: 3px solid var(--accent); vertical-align: middle; margin-right: 6px; }

/* Wrapped */
.wrapbtn { display: inline-flex; align-items: center; gap: 8px; }
.wrapbtn .icon { width: 18px; height: 18px; }
#story { position: fixed; inset: 0; z-index: 40; background: hsl(230 20% 8%); display: grid; place-items: center; }
.story { position: relative; width: 100%; max-width: 480px; height: 100%; max-height: 900px; overflow: hidden; color: #fff;
  background: radial-gradient(120% 80% at 30% 10%, hsl(var(--sh) calc(var(--ss) * 1%) 42%), hsl(var(--sh) calc(var(--ss) * .8%) 16%));
  padding: calc(18px + env(safe-area-inset-top, 0px)) max(22px, env(safe-area-inset-right, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)) max(22px, env(safe-area-inset-left, 0px));
  display: flex; flex-direction: column; transition: background .5s; }
.story .bars { display: flex; gap: 4px; }

.story .sclose { position: absolute; top: calc(30px + env(safe-area-inset-top, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); z-index: 3; width: 40px; height: 40px; border-radius: 50%; border: 0; background: hsl(0 0% 100% / .18); color: #fff; font-size: 1.4rem; cursor: pointer; }

/* lettera di fine mese */
.lettercard { display: flex; align-items: center; gap: 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 22px; padding: 14px 16px; margin-bottom: 16px; box-shadow: 0 10px 28px -18px hsl(var(--h) 45% 15% / .5); }

@keyframes envwiggle { 0%, 70%, 100% { transform: rotate(0); } 76% { transform: rotate(-10deg) scale(1.08); } 84% { transform: rotate(8deg) scale(1.08); } 92% { transform: rotate(-4deg); } }

.paper { pointer-events: auto; width: 100%; max-height: calc(100% - 96px); overflow-y: auto; text-align: left; background: #fffaf0; color: #3b2b1c; border-radius: 22px; padding: 24px 22px 20px; box-shadow: 0 24px 50px -20px #000a; font-size: 1.02rem; line-height: 1.55; font-weight: 600; animation: paperin .8s cubic-bezier(.22, 1.2, .36, 1) both; background-image: repeating-linear-gradient(transparent 0 30px, #e9dcc4 30px 31px); background-position: 0 14px; }

/* feste */
.festa-chip { margin: 2px 0 0; font-weight: 800; font-size: .86rem; color: var(--accent); background: var(--accent-soft); border-radius: 999px; padding: 5px 12px; }

@keyframes fw { 0% { opacity: 0; transform: rotate(var(--a)) translateX(0); } 6% { opacity: 1; } 55% { opacity: .9; } 100% { opacity: 0; transform: rotate(var(--a)) translateX(70px) translateY(14px); } }

.qcard.deck { touch-action: pan-y; transition: transform .28s cubic-bezier(.22, 1.2, .36, 1), opacity .28s; box-shadow: 0 9px 0 -4px var(--surface), 0 9px 0 -2px var(--line), 0 18px 0 -10px var(--surface), 0 18px 0 -8px var(--line), 0 24px 30px -16px hsl(var(--h) 45% 25% / .3); }

function demoEntries(y, m) {

async function makeSticker(st) {
  const S = 512, M = 392; const c = document.createElement("canvas"); c.width = S; c.height = S; const x = c.getContext("2d");
  const fd = getComputedStyle(document.documentElement).getPropertyValue("--font-display").trim() || "sans-serif";
  try { await document.fonts.load(`80px "Bagel Fat One"`); } catch {}
  const im = new Image(); im.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svgForCanvas(stickerSvg(st), M)); await im.decode();
  // bordo bianco da sticker: la sagoma in bianco, ripetuta tutto intorno
  const sil = document.createElement("canvas"); sil.width = M; sil.height = M; const sx = sil.getContext("2d");
  sx.drawImage(im, 0, 0, M, M); sx.globalCompositeOperation = "source-in"; sx.fillStyle = "#fff"; sx.fillRect(0, 0, M, M);

  for (let a = 0; a < 24; a++) { const t = a * Math.PI / 12; x.drawImage(sil, ox + Math.cos(t) * 11, oy + Math.sin(t) * 11); }
  x.drawImage(im, ox, oy, M, M);
  let fs = 66; x.font = `${fs}px ${fd}`; while (x.measureText(st.t).width > S - 44 && fs > 30) { fs -= 4; x.font = `${fs}px ${fd}`; }
  x.textAlign = "center"; x.lineJoin = "round"; const ty = S - 26;
  x.lineWidth = 18; x.strokeStyle = "#fff"; x.strokeText(st.t, S / 2, ty);
  const lv = levelOf(st.m); x.fillStyle = `hsl(${lv.ch} 55% 28%)`; x.fillText(st.t, S / 2, ty);
  return new Promise((ok, ko) => c.toBlob(b => b ? ok(b) : ko(new Error("toBlob")), "image/png"));
}
async function sendSticker(i, btn) {
  const st = stickerList()[i]; if (!st || btn.classList.contains("busy")) return;

  const name = `ranzi-${st.t.toLowerCase().replace(/[^a-zà-ù]+/g, "-").replace(/^-|-$/g, "")}.png`;

}

function sfx(kind) {
  if (!state.profile.sound) return;
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)(); if (AC.state === "suspended") AC.resume();
    const t0 = AC.currentTime;
    const seq = { tap: [660], pos: [660, 880], mid: [523], neg: [392, 294], reveal: [523, 659, 784, 1047], boing: [260], fire: [140, 110, 90] }[kind] || [600];
    seq.forEach((f, i) => {
      const o = AC.createOscillator(), gn = AC.createGain(), t = t0 + i * .09;
      o.type = kind === "fire" ? "sawtooth" : kind === "boing" ? "triangle" : "sine";
      o.frequency.setValueAtTime(f, t); if (kind === "boing") o.frequency.exponentialRampToValueAtTime(f * 2.4, t + .14);
      gn.gain.setValueAtTime(.0001, t); gn.gain.exponentialRampToValueAtTime(kind === "fire" ? .08 : .16, t + .02); gn.gain.exponentialRampToValueAtTime(.0001, t + (kind === "fire" ? .35 : .24));
      o.connect(gn).connect(AC.destination); o.start(t); o.stop(t + .4);
    });
  } catch {}
}

let photoCol = null;
const IDB = (() => {
  let p = null;
  const open = () => p = p || new Promise((ok, ko) => { const r = indexedDB.open("ranzidometro", 1); r.onupgradeneeded = () => r.result.createObjectStore("photos"); r.onsuccess = () => ok(r.result); r.onerror = () => ko(r.error); });
  const tx = async (mode, fn) => { const db = await open(); return new Promise((ok, ko) => { const t = db.transaction("photos", mode); const req = fn(t.objectStore("photos")); t.oncomplete = () => ok(req && req.result); t.onerror = () => ko(t.error); }); };
  return { get: k => tx("readonly", st => st.get(k)).catch(() => null), set: (k, v) => tx("readwrite", st => st.put(v, k)).catch(() => null), del: k => tx("readwrite", st => st.delete(k)).catch(() => null) };
})();
async function getPhoto(k) {
  const d = await IDB.get(k); if (d) return d;
  if (photoCol) { try { const sn = await photoCol.doc(k).get(); const v = sn && sn.exists ? sn.data() : null; if (v && v.img) { IDB.set(k, v.img); return v.img; } } catch {} }

}

}

    const im = new Image(); im.src = url; await im.decode();
    const M = 900, sc = Math.min(1, M / Math.max(im.naturalWidth, im.naturalHeight));
    const c = document.createElement("canvas"); c.width = Math.round(im.naturalWidth * sc); c.height = Math.round(im.naturalHeight * sc);
    c.getContext("2d").drawImage(im, 0, 0, c.width, c.height);

    return d;

}

function svgForCanvas(svg, size) {

  if (line) lines.push(line); return lines;

async function makeWrapImage(w) {

  const lv = levelOf(w.aMood);

  try { await Promise.all([document.fonts.load(`80px "Bagel Fat One"`), document.fonts.load(`800 40px "Nunito"`)]); } catch {}
  const gr = x.createRadialGradient(W * .3, H * .1, 40, W * .5, H * .5, H);

  x.fillStyle = gr; x.fillRect(0, 0, W, H);

  for (let i = 0; i < 36; i++) { x.beginPath(); x.arc(hash("x" + i) % W, hash("y" + i) % H, hash("r" + i) % 28 + 6, 0, Math.PI * 2); x.fill(); }
  x.textAlign = "center"; x.fillStyle = "#fff";
  x.globalAlpha = .82; x.font = `800 32px ${fb}`; x.fillText(`IL MIO ${w.label.toUpperCase()}`, W / 2, 96); x.globalAlpha = 1;

    await im.decode(); x.drawImage(im, (W - 440) / 2, 120, 440, 440);
  } catch {}

  boxes.forEach(([val, lab], i) => {
    const bx = bx0 + i * (bw + gap);

  let ly = by + 270; x.font = `700 36px ${fb}`;

  if (w.topTag) x.fillText(`${TAGBY[w.topTag[0]].ic} Tema del mese: ${TAGBY[w.topTag[0]].t}`, W / 2, ly);
  x.globalAlpha = .7; x.font = `30px ${fd}`; x.fillText("Ranzidometro", W / 2, H - 56); x.globalAlpha = 1;

async function prepWrapImage() {

async function saveBlob(blob, name) {

  const plain = () => { try { const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000); toast("File scaricato"); } catch { toast("Non riesco a salvare il file qui"); } };

  }
}
